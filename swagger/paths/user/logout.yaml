#/swagger/paths/user/logout.yaml

tags:
  - User
summary: Logout user
operationId: logoutUser
description: 'Logout a user with payload'
security:
  - bearerAuth: []
responses:
  '200':
    description: Logout user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logout a user!
            data:
              type: object
              $ref: '../../components/schemas/user.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
